<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111113" />
  <title>今夜唱什么</title>
  <meta name="description" content="给我五首，现在选一首唱。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23f4efdf'/%3E%3Cpath d='M40 10v29.5a9.5 9.5 0 1 1-5-8.35V18l17-4v23.5a9.5 9.5 0 1 1-5-8.35V10z' fill='%23111113'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#141417;--muted:#77767c;--line:#e7e5e1;--paper:#fbfaf8;--accent:#d9ff3f;--pink:#ff6a98;--card:#fff;--shadow:0 16px 40px rgba(26,24,22,.07)}
    *{box-sizing:border-box} body{margin:0;background:#efeeeb;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;letter-spacing:.01em}
    button{font:inherit;color:inherit;border:0;background:none;cursor:pointer} .app{min-height:100vh;max-width:620px;margin:auto;background:var(--paper);position:relative;overflow:hidden}
    header{height:80px;padding:20px 21px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px}.mark{background:var(--ink);color:var(--accent);height:37px;width:37px;border-radius:12px;display:grid;place-items:center;font-size:19px;font-weight:900;transform:rotate(-5deg)} .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;margin-bottom:3px}.brand strong{font-size:17px;letter-spacing:.04em}
    .top-actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:17px}.icon-btn:hover{background:#f0efeb}
    main{padding:22px 21px 110px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#ecebe7;border-radius:14px;padding:4px;margin-bottom:19px}.tab{height:39px;border-radius:10px;color:#747379;font-weight:650;font-size:15px}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.07)}
    .context{display:flex;justify-content:space-between;align-items:flex-start;margin:4px 2px 18px}.context h1{font-size:24px;margin:0 0 5px;letter-spacing:-.04em}.context p{margin:0;color:var(--muted);font-size:13px}.session{font-size:12px;color:#77736b;padding-top:6px}.session i{display:inline-block;width:6px;height:6px;border-radius:99px;background:#a5cb1b;margin-right:5px}
    .song-list{display:flex;flex-direction:column;gap:11px}.song{background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:111px;padding:13px 12px 11px;display:grid;grid-template-columns:62px minmax(0,1fr) 38px;gap:12px;box-shadow:0 3px 10px rgba(17,17,17,.025);animation:rise .32s ease both}.song:nth-child(2){animation-delay:.04s}.song:nth-child(3){animation-delay:.08s}.song:nth-child(4){animation-delay:.12s}.song:nth-child(5){animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    .cover{width:62px;height:62px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;letter-spacing:.08em;position:relative;overflow:hidden}.cover:after{content:"";position:absolute;width:55px;height:55px;border:1px solid rgba(255,255,255,.45);border-radius:50%;top:-25px;right:-19px}.c1{background:linear-gradient(135deg,#1f2937,#7b2637)}.c2{background:linear-gradient(135deg,#e86c5b,#583d75)}.c3{background:linear-gradient(135deg,#a6bc51,#235f63)}.c4{background:linear-gradient(135deg,#e3ae36,#c54c3e)}.c5{background:linear-gradient(135deg,#4f65a5,#24254b)}.c6{background:linear-gradient(135deg,#cf516b,#f3ba54)}
    .song-name{font-size:17px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;margin:1px 0 5px}.artist{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;gap:4px;margin-top:13px}.weight{font-size:12px;color:#8b898e;border-radius:6px;padding:5px 6px;white-space:nowrap}.weight.active{color:var(--ink);background:var(--accent);font-weight:750}.more{font-size:18px;line-height:1;margin-left:1px;padding:2px 5px;color:#69676c}.check{width:33px;height:33px;border:2px solid #b6b4b1;border-radius:10px;margin-top:12px;display:grid;place-items:center;font-size:19px;color:transparent;transition:.15s}.check:hover{border-color:var(--ink)}
    .refresh-wrap{display:grid;place-items:center;padding:26px 0 8px}.refresh{width:55px;height:55px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-size:25px;box-shadow:0 9px 20px rgba(20,20,23,.18);transition:.16s}.refresh:hover{transform:rotate(35deg) scale(1.04)}.refresh small{display:block;color:var(--muted);font-size:12px;margin-top:9px}.empty{text-align:center;padding:66px 20px;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
    .toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,100px);background:#1e1e21;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);transition:.25s;z-index:20;white-space:nowrap}.toast.show{transform:translate(-50%,0)}
    .shade{position:fixed;inset:0;background:rgba(19,18,20,.36);display:none;z-index:30}.shade.open{display:block}.modal{position:fixed;z-index:31;left:50%;bottom:0;transform:translate(-50%,105%);width:min(620px,100%);background:#fff;border-radius:24px 24px 0 0;padding:22px 21px calc(25px + env(safe-area-inset-bottom));transition:.28s}.modal.open{transform:translate(-50%,0)}.handle{width:35px;height:4px;background:#d7d5d1;border-radius:5px;margin:0 auto 20px}.modal h2{font-size:20px;margin:0 0 8px}.modal p{color:#6d6b70;margin:0 0 22px;font-size:14px;line-height:1.6}.modal .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modal button{padding:14px;border-radius:12px;font-weight:750}.cancel{background:#f0efec}.danger{background:#ffdfdf;color:#9b2828}.settings-row{display:flex;justify-content:space-between;padding:17px 0;border-top:1px solid var(--line);font-size:15px}.settings-row span{color:var(--muted)}.update{display:block;width:100%;padding:14px;border-radius:12px;background:var(--accent);font-weight:750;margin:5px 0 19px}
    @media(min-width:700px){body{padding:26px 0}.app{min-height:calc(100vh - 52px);border-radius:28px;box-shadow:var(--shadow)}header{border-radius:28px 28px 0 0}.song{min-height:117px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="brand"><div class="mark">♪</div><div><small>PERSONAL KTV</small><strong>今夜唱什么</strong></div></div><div class="top-actions"><button class="icon-btn" aria-label="结束本次 KTV" onclick="confirmEnd()">⌁</button><button class="icon-btn" aria-label="设置" onclick="openSettings()">⚙</button></div></header>
  <main><nav class="tabs" aria-label="歌曲语言"><button class="tab active" data-lang="中文">中文</button><button class="tab" data-lang="日文">日文</button><button class="tab" data-lang="英文">英文</button></nav><div class="context"><div><h1 id="title">中文，唱哪首？</h1><p id="sub">给你 5 首，都是不同歌手</p></div><div class="session"><i></i>本次 KTV</div></div><section class="song-list" id="songs" aria-live="polite"></section><div class="refresh-wrap" id="refreshWrap"><button class="refresh" aria-label="换一批" onclick="refreshSongs()">↻</button><small>换一批</small></div></main>
</div>
<div class="toast" id="toast"></div><div class="shade" id="shade" onclick="closeModal()"></div><section class="modal" id="modal" role="dialog" aria-modal="true"></section>
<script>
const library={
 中文:[['后来','刘若英','后 来','c1'],['红豆','王菲','红 豆','c2'],['晴天','周杰伦','晴 天','c3'],['可惜没如果','林俊杰','可 惜','c4'],['十年','陈奕迅','十 年','c5'],['小幸运','田馥甄','幸 运','c6'],['说好不哭','周杰伦','不 哭','c1'],['我怀念的','孙燕姿','怀 念','c2'],['修炼爱情','林俊杰','修 炼','c3'],['你的答案','阿冗','答 案','c4'],['慢冷','梁静茹','慢 冷','c5']],
 日文:[['Lemon','米津玄師','LE MON','c1'],['奏','スキマスイッチ','奏','c2'],['Pretender','Official髭男dism','PRE','c3'],['アイドル','YOASOBI','IDOL','c4'],['夜に駆ける','YOASOBI','夜 駆','c5'],['カタオモイ','Aimer','KATA','c6'],['マリーゴールド','あいみょん','MARI','c1'],['First Love','宇多田ヒカル','FIRST','c2'],['ドライフラワー','優里','DRY','c3']],
 英文:[['Love Story','Taylor Swift','LOVE','c1'],['Someone Like You','Adele','SOME','c2'],['Yellow','Coldplay','YELL','c3'],['Just The Way You Are','Bruno Mars','JUST','c4'],['Perfect','Ed Sheeran','PERF','c5'],['Shallow','Lady Gaga','SHAL','c6'],['Counting Stars','OneRepublic','STAR','c1'],['Stay With Me','Sam Smith','STAY','c2']]
};
const state=JSON.parse(localStorage.getItem('ktv-prototype')||'{"lang":"中文","shown":{},"current":{},"pref":{},"sung":0,"history":3}');state.shown??={};state.current??={};state.pref??={};
let pendingSong=null; const $=s=>document.querySelector(s); const key=s=>state.lang+'|'+s[0];
function save(){localStorage.setItem('ktv-prototype',JSON.stringify(state))}function candidates(){let used=new Set(state.shown[state.lang]||[]);return library[state.lang].filter(s=>!used.has(s[0]))}function pick(){let pool=candidates(), artists=new Set(),out=[];pool.sort((a,b)=>(state.pref[key(b)]==='多推荐')-(state.pref[key(a)]==='多推荐')+Math.random()-.5);for(const s of pool){if(!artists.has(s[1])&&out.length<5){out.push(s);artists.add(s[1])}}return out}
function init(){if(!state.current[state.lang]?.length){state.current[state.lang]=pick();state.shown[state.lang]=[...(state.shown[state.lang]||[]),...state.current[state.lang].map(x=>x[0])];save()}render()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));$('#title').textContent=state.lang+'，唱哪首？';let list=state.current[state.lang]||[],root=$('#songs');$('#sub').textContent=list.length?`给你 ${list.length} 首，都是不同歌手`:'本次 KTV 这类歌都看过了';root.innerHTML=list.length?list.map((s,i)=>`<article class="song"><div class="cover ${s[3]}">${s[2]}</div><div><div class="song-name">${s[0]}</div><div class="artist">${s[1]}</div><div class="controls">${['少推荐','正常','多推荐'].map(p=>`<button class="weight ${pref(s)===p?'active':''}" onclick="setPref(${i},'${p}')">${p}</button>`).join('')}<button class="more" aria-label="${s[0]} 更多操作" onclick="blacklist(${i})">⋯</button></div></div><button class="check" aria-label="唱了 ${s[0]}" onclick="sung(${i})">✓</button></article>`).join(''):`<div class="empty"><b>这一类歌，今晚都看过了</b>换个语言，或结束本次 KTV 再来。</div>`;$('#refreshWrap').style.display=list.length?'grid':'none'}
function pref(s){return state.pref[key(s)]||'正常'}function setPref(i,p){let s=state.current[state.lang][i];state.pref[key(s)]=p;save();render();toast(p==='多推荐'?'之后会更常推荐这首':'已更新推荐偏好')}
function sung(i){let s=state.current[state.lang][i];state.current[state.lang].splice(i,1);state.sung++;save();render();toast('已记为唱了 · 本次共 '+state.sung+' 首')}
function refreshSongs(){state.current[state.lang]=pick();state.shown[state.lang]=[...(state.shown[state.lang]||[]),...state.current[state.lang].map(x=>x[0])];save();render();toast('换了一批')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;save();init()});
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>x.classList.remove('show'),1800)}function modal(html){$('#modal').innerHTML=html;$('#shade').classList.add('open');$('#modal').classList.add('open')}function closeModal(){$('#shade').classList.remove('open');$('#modal').classList.remove('open')}
function blacklist(i){pendingSong=state.current[state.lang][i];modal(`<div class="handle"></div><h2>加入黑名单？</h2><p>“${pendingSong[0]}”以后不会再出现在推荐中。</p><div class="actions"><button class="cancel" onclick="closeModal()">取消</button><button class="danger" onclick="doBlacklist()">加入黑名单</button></div>`)}function doBlacklist(){state.current[state.lang]=state.current[state.lang].filter(s=>s!==pendingSong);state.shown[state.lang]=(state.shown[state.lang]||[]).filter(n=>n!==pendingSong[0]);state.shown[state.lang].push(pendingSong[0]);save();closeModal();render();toast('已加入黑名单')}
function confirmEnd(){modal(`<div class="handle"></div><h2>结束本次 KTV？</h2><p>会记录本次唱了 ${state.sung} 首，并清空今晚已出现的歌曲。</p><div class="actions"><button class="cancel" onclick="closeModal()">继续唱</button><button class="danger" onclick="endSession()">结束本次</button></div>`)}function endSession(){state.history++;state.shown={};state.current={};state.sung=0;save();closeModal();init();toast('本次 KTV 已结束')}
function openSettings(){modal(`<div class="handle"></div><h2>设置</h2><p>你的歌曲和偏好只保存在这台设备。</p><button class="update" onclick="closeModal();toast('网易云数据已更新（演示）')">更新网易云数据</button><div class="settings-row">黑名单 <span>0 首</span></div><div class="settings-row">KTV 历史 <span>${state.history} 次</span></div><div class="settings-row">清除本地数据 <span>›</span></div>`)}init();
</script>
</body></html>
