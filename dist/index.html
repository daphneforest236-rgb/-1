id){let s=get(id);sheet(`<div class="handle"></div><h2>加入黑名单？</h2><p>“${h(s.title)}”以后不会再出现在推荐中。</p><div class="twos"><button class="cancel" onclick="more('${id}')">取消</button><button class="confirm" onclick="black('${id}')">加入黑名单</button></div>`)}function black(id){let s=get(id);s.black=true;state.session.current[s.lang]=state.session.current[s.lang].filter(x=>x!==id);save();closeSheet();render();toast('已加入黑名单')}function endAsk(){sheet(`<div class="handle"></div><h2>结束本次 KTV？</h2><p>会记录本次唱了 ${state.session.sung} 首，并清空今晚已出现的歌曲。</p><div class="twos"><button class="cancel" onclick="closeSheet()">继续唱</button><button class="confirm" onclick="endSession()">结束本次</button></div>`)}function endSession(){state.history.unshift({date:new Date().toLocaleDateString('zh-CN'),count:state.session.sung});state.session=es();save();closeSheet();ensure();toast('本次 KTV 已结束')}function settings(){sheet(`<div class="handle"></div><h2>设置</h2><button class="primary" onclick="importView()">更新网易云数据</button><button class="row" onclick="blackView()">黑名单 <span>${state.library.filter(s=>s.black).length} 首　›</span></button><button class="row" onclick="historyView()">KTV 历史 <span>${state.history.length} 次　›</span></button><button class="row danger" onclick="clearOne()">清除所有数据 <span>›</span></button>`)}function importView(){let c=l=>state.library.filter(s=>s.lang===l&&!s.black).length;sheet(`<div class="handle"></div><h2>网易云数据已更新</h2><div class="note">已从「${window.KTV_IMPORTED?.name||'KTV必唱歌曲'}」导入 ${state.library.length} 首歌曲。没有播放次数或歌词数据，因此未虚构近期排行、历史排行或自动可唱性结论。</div><p>新增歌曲　${state.library.length}<br>合并重复版本　1<br><br>中文　${c('中文')} · 日文　${c('日文')} · 英文　${c('英文')}</p><button class="secondary" onclick="closeSheet()">知道了</button>`)}function blackView(){let a=state.library.filter(s=>s.black);sheet(`<div class="handle"></div><h2>黑名单</h2><p>${a.length?'以下歌曲不会被推荐。':'还没有手动加入黑名单的歌曲。'}</p>${a.map(s=>`<div class="list-item">${h(s.title)}<span>${h(s.artist)}</span></div>`).join('')}`)}function historyView(){sheet(`<div class="handle"></div><h2>KTV 历史</h2><p>${state.history.length?'只记录日期与当次唱歌数量。':'还没有已结束的 KTV。'}</p>${state.history.map(x=>`<div class="list-item">${x.date}<span>${x.count} 首</span></div>`).join('')}`)}function clearOne(){sheet(`<div class="handle"></div><h2>清除所有数据？</h2><p>将删除本地歌曲曲库、推荐偏好、黑名单、人工语言分类、KTV 历史和当前 KTV 会话。</p><div class="twos"><button class="cancel" onclick="settings()">取消</button><button class="confirm" onclick="clearTwo()">继续</button></div>`)}function clearTwo(){sheet(`<div class="handle"></div><h2>确认无法撤销</h2><p>所有本地 KTV 数据将被永久清除。</p><div class="twos"><button class="cancel" onclick="settings()">返回</button><button class="confirm" onclick="clearAll()">确认清除</button></div>`)}function clearAll(){localStorage.removeItem('ktv-v1');state=ns();state.library=incoming;closeSheet();ensure();toast('已清除所有本地数据')}ensure();

<script>
(() => {
  const baseLanguages = ['中文', '日文', '英文'];
  const commonLanguages = ['韩文', '粤语', '法语', '西班牙语', '德语', '俄语', '泰语'];
  state.languages ??= [...baseLanguages, ...(state.customLangs ?? [])];
  delete state.customLangs;
  document.head.insertAdjacentHTML('beforeend', '<style>.langs{align-items:center;flex-wrap:wrap}.add-lang{width:29px;height:29px;border:1px solid #4a474c;border-radius:50%;color:#c4c0c4;font-size:21px;line-height:1}.add-lang:hover{border-color:#ef4051;color:#fff}.language-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #302f34;padding:13px 1px;font-size:16px}.language-row button{min-width:52px;padding:7px 10px;border:1px solid #57535a;border-radius:99px;font-size:13px}.language-row button.danger{border-color:#73414a}.language-row button:disabled{color:#77737a;border-color:#3e3c42}</style>');
  const allLanguages = () => state.languages;
  const nav = document.querySelector('.langs');
  function selectLanguage(language) {
    state.session.lang = language;
    state.session.shown[language] ??= [];
    state.session.current[language] ??= [];
    save(); ensureCustom();
  }
  function syncLanguageTabs() {
    nav.innerHTML = '';
    state.languages.forEach(language => {
      const button = document.createElement('button');
      button.className = 'lang'; button.dataset.lang = language; button.textContent = language;
      button.onclick = () => selectLanguage(language); nav.append(button);
    });
    const add = document.createElement('button');
    add.className = 'add-lang'; add.type = 'button'; add.setAttribute('aria-label', '语言管理'); add.textContent = '+';
    add.onclick = openLanguageManager; nav.append(add);
  }
  function ensureCustom() {
    const language = L(); state.session.shown[language] ??= []; state.session.current[language] ??= [];
    if (!state.session.current[language].length) { const choices = pick(); state.session.current[language] = choices; state.session.shown[language] = [...new Set([...state.session.shown[language], ...choices])]; save(); }
    render();
  }
  function openLanguageManager() {
    const managedLanguages = [...new Set([...baseLanguages, ...commonLanguages])];
    sheet(`<div class="handle"></div><h2>语言管理</h2><p>移除后，该语言下的歌曲会转入保留列表中的第一种语言。</p>${managedLanguages.map(language => { const added = state.languages.includes(language); const action = added ? (state.languages.length > 1 ? `<button class="danger" onclick="removeLanguage('${language}')">移除</button>` : '<button disabled>保留</button>') : `<button onclick="chooseCustomLanguage('${language}')">添加</button>`; return `<div class="language-row"><span>${language}</span>${action}</div>`; }).join('')}`);
  }
  window.chooseCustomLanguage = language => {
    if (!state.languages.includes(language)) state.languages.push(language);
    state.session.shown[language] ??= []; state.session.current[language] ??= [];
    save(); syncLanguageTabs(); openLanguageManager(); toast(`已添加${language}`);
  };
  window.removeLanguage = language => {
    if (state.languages.length <= 1) return;
    const fallback = state.languages.find(item => item !== language);
    state.library.forEach(song => { if (song.lang === language) song.lang = fallback; });
    state.languages = state.languages.filter(item => item !== language);
    delete state.session.shown[language]; delete state.session.current[language];
    if (L() === language) state.session.lang = fallback;
    state.session.shown[fallback] ??= []; state.session.current[fallback] ??= [];
    save(); syncLanguageTabs(); ensureCustom(); openLanguageManager(); toast(`已移除${language}`);
  };
  window.more = id => { const song = get(id); sheet(`<div class="handle"></div><h2>${h(song.title)}</h2>${allLanguages().map(language => `<button class="option" onclick="move('${id}','${language}')">移动到${language}</button>`).join('')}<button class="option danger" onclick="blackAsk('${id}')">加入黑名单<small>以后不再参与推荐</small></button>`); };
  window.move = (id, language) => {
    const song = get(id); state.session.current[song.lang] ??= []; state.session.current[song.lang] = state.session.current[song.lang].filter(songId => songId !== id);
    state.session.shown[language] ??= []; state.session.current[language] ??= []; song.lang = language; song.manual = true;
    save(); closeSheet(); render(); toast(`已移动到${language}`);
  };
  state.session.shown[L()] ??= []; state.session.current[L()] ??= [];
  syncLanguageTabs(); ensureCustom();
})();
</script>
<script>
(() => {

  document.head.insertAdjacentHTML('beforeend', '<style>.sync-meta{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #302f34;font-size:14px}.sync-meta span{color:#99969b;text-align:right}.sync-section{margin:20px 0 7px;font-size:13px;color:#99969b}.sync-status{display:inline-flex;align-items:center;gap:7px;color:#aaa6ab;font-size:13px}.sync-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#e7923d}.sync-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.sync-actions button{padding:13px;border-radius:13px;border:1px solid #57535a;font-weight:700}.sync-actions .sync-primary{background:#f4efe8;color:#171619;border:0}.sync-actions button:disabled{opacity:.45}.source-remove{color:#ff9ca6}.pending-empty{padding:17px 0;color:#99969b;font-size:14px}</style>');
  function syncSummary() {
    const latest = sync.batches[0];
    return latest ? `新增 ${latest.added} · 更新 ${latest.updated} · 暂缓 ${latest.held} · 失败 ${latest.failed}` : '暂无同步记录';
  }
  window.settings = () => {
    sheet(`<div class="handle"></div><h2>设置</h2><button class="primary" onclick="openDataSync()">数据同步</button><button class="row" onclick="blackView()">黑名单 <span>${state.library.filter(song => song.black).length} 首　›</span></button><button class="row" onclick="historyView()">KTV 历史 <span>${state.history.length} 次　›</span></button><button class="row danger" onclick="clearOne()">清除所有数据 <span>›</span></button>`);
  };

    sheet(`<div class="handle"></div><h2>数据同步</h2><div class="sync-status">本机数据连接器：${sync.connector}</div><div class="sync-meta">上次同步 <span>${last}</span></div><div class="sync-meta">自动同步 <span>${sync.auto ? `每 ${sync.periodHours} 小时检查` : '已暂停'}</span></div><div class="sync-section">数据来源</div>${sync.sources.length ? sync.sources.map(source => `<div class="sync-meta">${h(source.name)}<span>${source.type} · ${source.count} 首<br><button class="source-remove" onclick="askRemoveSource('${source.id}')">移除数据来源</button></span></div>`).join('') : '<div class="pending-empty">尚未选择同步来源。</div>'}<div class="sync-section">最近一次导入</div><div class="sync-meta">${syncSummary()}<span>${sync.batches[0]?.automatic ? '自动同步' : '手动导入'}</span></div><div class="sync-section">待确认歌曲</div>${sync.pending.length ? `<button class="secondary" onclick="openPendingSongs()">${sync.pending.length} 首待确认　›</button>` : '<div class="pending-empty">没有需要确认的歌曲。</div>'}<div class="sync-actions"><button class="sync-primary" onclick="syncNow()">立即同步</button><button onclick="toggleAutoSync()">${sync.auto ? '暂停自动同步' : '恢复自动同步'}</button><button onclick="connectorHelp()">重新扫码</button><button ${sync.inProgress ? '' : 'disabled'} onclick="cancelCurrentSync()">取消本次同步</button><button ${sync.batches[0]?.automatic ? '' : 'disabled'} onclick="undoLatestImport()">撤销本次导入</button></div>`);
  };
  window.syncNow = () => {
    if (sync.connector !== '已连接') { toast('未检测到本机数据连接器'); return; }
    toast('正在校验本机数据源');
  };
  window.cancelCurrentSync = () => { sync.inProgress = false; save(); openDataSync(); toast('已取消本次同步'); };
  window.toggleAutoSync = () => { sync.auto = !sync.auto; save(); openDataSync(); toast(sync.auto ? '已恢复自动同步' : '已暂停自动同步'); };
  window.connectorHelp = () => sheet(`<div class="handle"></div><h2>连接网易云</h2><p>需要先安装并运行本机数据连接器，再使用网易云 App 扫码授权。授权信息只保留在你的电脑上，不会上传到外部服务器。</p><button class="secondary" onclick="openDataSync()">返回数据同步</button>`);
  window.askRemoveSource = id => sheet(`<div class="handle"></div><h2>移除数据来源？</h2><p>将停止从该来源自动同步。已导入到本地的歌曲、偏好、黑名单和 KTV 历史不会被删除。</p><div class="twos"><button class="cancel" onclick="openDataSync()">取消</button><button class="confirm" onclick="removeSource('${id}')">移除来源</button></div>`);
  window.removeSource = id => { sync.sources = sync.sources.filter(source => source.id !== id); save(); openDataSync(); toast('已移除数据来源'); };
  window.openPendingSongs = () => sheet(`<div class="handle"></div><h2>待确认歌曲</h2><p>只有语言或人声类型无法可靠判断的歌曲会出现在这里；待确认歌曲不会进入推荐池。</p><div class="pending-empty">当前没有待确认歌曲。</div><button class="secondary" onclick="openDataSync()">返回数据同步</button>`);
  window.undoLatestImport = () => { toast('当前没有可撤销的自动导入批次'); };
})();
</script>
<script>
(() => {
  const CONNECTOR = 'http://127.0.0.1:16368';
  let qrTimer = null;
  const sync = state.sync ??= {};
  // v2 deliberately separates songs already in this browser from a scan that
  // happens now.  Do not turn an old batch into a fresh-result badge.
  if (sync.liveVersion !== 2) {
    sync.historySongCount = state.library.length;
    sync.lastLiveScan = null;
    sync.batches = [];
    sync.sources = [];
    sync.lastError = null;
    sync.liveVersion = 2;
    save();
  }
  const safe = value => h(String(value ?? ''));
  const cnTime = value => value ? new Date(value).toLocaleString('zh-CN', { hour12: false }) : '尚未完成自动同步';
  const connectorFetch = async (path, options = {}) => {
    let response;
    try {
      response = await fetch(CONNECTOR + path, {
        method: options.method || 'GET',
        headers: options.body ? { 'Content-Type': 'application/json' } : undefined,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
    } catch {
      throw new Error('连接器未启动。请先运行 npm run connector。');
    }
    const payload = await response.json().catch(() => ({}));
    if (!response.ok || payload.error) throw new Error(payload.error || '本机数据连接器返回异常。');
    return payload;
  };
  const statusText = status => {
    if (!status) return '未连接';
    if (status.connected) return '已授权';
    return status.connector === 'ready' ? '等待扫码授权' : '未连接';
  };
  const syncSummary = () => {
    const latest = sync.batches?.[0];
    return latest ? `扫描 ${latest.scanned ?? '-'} · 新增 ${latest.added || 0} · 更新 ${latest.updated || 0} · 已存在 ${latest.existing || 0} · 待确认 ${latest.held || 0}` : '暂无同步记录';
  };
  const lastSyncMs = status => status?.lastSyncAt ? new Date(status.lastSyncAt).getTime() : 0;
  const shouldAutoSync = status => {
    if (!status?.connected || !status.autoSync || status.syncing || !status.sources?.length) return false;
    const elapsed = Date.now() - lastSyncMs(status);
    return !lastSyncMs(status) || elapsed >= (status.syncPeriodHours || 12) * 60 * 60 * 1000;
  };
  const coverFor = index => ['a', 'b', 'c', 'd', 'e', 'f'][index % 6];
  const songFromConnector = (item, index) => ({
    id: item.id,
    title: item.title,
    artist: item.artist,
    lang: item.language?.value || '中文',
    cover: coverFor(state.library.length + index),
    recent: 0,
    total: 0,
    pref: '正常',
    black: false,
    manual: false,
    source: 'connector',
    neteaseSongId: item.neteaseSongId,
    sources: item.sourceIds || []
  });
  const applyStatus = status => {
    sync.connector = statusText(status);
    sync.lastSync = status?.lastSyncAt ? cnTime(status.lastSyncAt) : sync.lastSync || null;
    sync.auto = status?.autoSync ?? sync.auto ?? true;
    sync.periodHours = status?.syncPeriodHours ?? sync.periodHours ?? 12;
    sync.sources = (status?.sources || []).map(source => ({ ...source, type: '网易云歌单', count: source.count || '待同步' }));
    sync.inProgress = Boolean(status?.syncing);
    sync.pendingCount = status?.pendingCount || 0;
    sync.queueCount = status?.queueCount || 0;
    sync.recordCount = status?.recordCount || 0;
    sync.lastError = status?.lastError || null;
    save();
    return status;
  };
  const checkConnector = async () => {
    try { return applyStatus(await connectorFetch('/health')); }
    catch (error) {
      sync.connector = '未连接';
      sync.lastError = error.message;
      save();
      return null;
    }
  };
  const queueItems = async () => {
    const queue = await connectorFetch('/queue');
    sync.pending = (queue.items || []).filter(item => item.status === 'pending');
    save();
    return queue.items || [];
  };
  const mergeReadySongs = items => {
    let added = 0, updated = 0, held = 0;
    const existing = new Map(state.library.map(song => [song.id, song]));
    items.forEach((item, index) => {
      if (item.status !== 'ready') { if (item.status === 'pending') held++; return; }
      const current = existing.get(item.id);
      if (current) {
        current.title = item.title || current.title;
        current.artist = item.artist || current.artist;
        current.album = item.album || current.album;
        current.sources = [...new Set([...(current.sources || []), ...(item.sourceIds || [])])];
        if (!current.manual && item.language?.value) current.lang = item.language.value;
        updated++;
      } else {
        state.library.push(songFromConnector(item, index));
        added++;
      }
    });
    state.languages ??= ['中文', '日文', '英文'];
    state.library.forEach(song => {
      if (!state.languages.includes(song.lang)) state.languages.push(song.lang);
      state.session.shown[song.lang] ??= [];
      state.session.current[song.lang] ??= [];
    });
    return { added, updated, held };
  };
  const applyMetadataUpdates = updates => {
    const existing = new Map(state.library.map(song => [song.id, song]));
    (updates || []).forEach(update => {
      const song = existing.get(update.id);
      if (!song) return;
      song.title = update.title || song.title;
      song.artist = update.artist || song.artist;
      song.album = update.album || song.album;
      song.durationMs = update.durationMs || song.durationMs;
      song.sources = [...new Set([...(song.sources || []), ...(update.sourceIds || [])])];
      if (!song.manual && update.language?.value) song.lang = update.language.value;
    });
  };
  const sourcePanel = () => sync.sources?.length
    ? sync.sources.map(source => `<div class="sync-meta">${safe(source.name)}<span>${safe(source.type)} · ${safe(source.count)}<br><button class="source-remove" onclick="askRemoveSource('${safe(source.id)}')">移除数据来源</button></span></div>`).join('')
    : `<div class="pending-empty">尚未选择同步来源。输入一个网易云歌单 ID 后才可以扫描。</div>`;
  document.head.insertAdjacentHTML('beforeend', '<style>.toast{z-index:30}.sync-status.ready:before{background:#49b36d}.sync-status.offline:before{background:#b94c5d}.qr-box{display:grid;place-items:center;margin:18px 0;padding:18px;border:1px solid #3d3a41;border-radius:13px;background:#17171b}.qr-box img{width:min(245px,80vw);height:auto;border-radius:8px;background:#fff}.qr-tip{font-size:13px;color:#aaa6ab;line-height:1.7}.pending-song{padding:13px 0;border-top:1px solid #302f34}.pending-song strong{display:block;font-size:15px}.pending-song span{display:block;margin-top:4px;color:#99969b;font-size:13px;line-height:1.55}.pending-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.pending-actions button{padding:9px 6px;border:1px solid #57535a;border-radius:10px;font-size:13px}</style>');
  window.openDataSync = async () => {
    const status = await checkConnector();
    const statusClass = status?.connected ? 'ready' : (status ? '' : 'offline');
    const live = sync.lastLiveScan;
    const result = live ? `本次实时扫描：${live.scanned} 首 · 新增 ${live.added} · 更新 ${live.updated} · 待确认 ${live.held}<span>${safe(live.time)}</span>` : '本次实时扫描：尚未进行';
    sheet(`<div class="handle"></div><h2>数据同步</h2><div class="sync-status ${statusClass}">本机数据连接器：${safe(sync.connector)}</div>${sync.lastError ? `<div class="note">本次操作失败：${safe(sync.lastError)}</div>` : ''}<div class="note">历史歌曲：当前页面保留 ${sync.historySongCount ?? state.library.length} 首旧数据；它们不是本次实时扫描结果。</div><div class="sync-section">网易云歌单来源</div>${sourcePanel()}<button class="secondary" onclick="addPlaylistSource()">输入网易云歌单 ID</button><div class="sync-section">实时扫描结果</div><div class="sync-meta">${result}</div><div class="sync-section">待确认歌曲</div>${(sync.pending?.length || sync.pendingCount) ? `<button class="secondary" onclick="openPendingSongs()">${sync.pending?.length || sync.pendingCount} 首待确认　›</button>` : '<div class="pending-empty">没有需要确认的歌曲。</div>'}<div class="sync-actions"><button class="sync-primary" onclick="syncNow()">扫描已选歌单</button><button onclick="connectorHelp()">网易云登录</button><button onclick="toggleAutoSync()">${sync.auto ? '暂停自动同步' : '恢复自动同步'}</button><button ${sync.queueCount ? '' : 'disabled'} onclick="cancelCurrentSync()">取消本次同步</button></div>`);
  };
  window.addPlaylistSource = async () => {
    const playlistId = window.prompt('请输入网易云歌单 ID（纯数字）：');
    if (playlistId === null) return;
    try {
      await connectorFetch('/sources', { method: 'POST', body: { playlistId } });
      await checkConnector();
      openDataSync();
      toast('已添加歌单来源');
    } catch (error) { toast(error.message); }
  };
  window.connectorHelp = async () => {
    clearInterval(qrTimer);
    sheet('<div class="handle"></div><h2>连接网易云</h2><p>正在创建本地授权二维码。</p><div class="qr-box">加载中</div><button class="secondary" onclick="openDataSync()">返回数据同步</button>');
    try {
      const qr = await connectorFetch('/auth/qr', { method: 'POST' });
      sheet(`<div class="handle"></div><h2>连接网易云</h2><p>用网易云音乐 App 扫码授权。授权信息只保存在这台电脑的连接器目录中。</p><div class="qr-box"><img src="${safe(qr.qrimg)}" alt="网易云扫码授权二维码"></div><div class="qr-tip" id="qrTip">等待扫码。</div><button class="secondary" onclick="openDataSync()">返回数据同步</button>`);
      qrTimer = setInterval(async () => {
        try {
          const auth = await connectorFetch('/auth/status');
          const tip = document.querySelector('#qrTip');
          if (tip) tip.textContent = auth.status === 'scanned_waiting_confirmation' ? '已扫码，请在手机上确认登录。' : auth.status === 'authorized' ? '授权完成。' : auth.status === 'expired' ? '二维码已过期，请重新扫码。' : '等待扫码。';
          if (auth.status === 'authorized') {
            clearInterval(qrTimer);
            await checkConnector();
            toast('网易云授权完成');
            openDataSync();
          }
          if (auth.status === 'expired') clearInterval(qrTimer);
        } catch (error) {
          clearInterval(qrTimer);
          toast(error.message);
        }
      }, 2500);
    } catch (error) { sheet(`<div class="handle"></div><h2>连接网易云</h2><div class="note">${safe(error.message)}</div><button class="secondary" onclick="openDataSync()">返回数据同步</button>`); }
  };
  const runSync = async ({ quiet = false } = {}) => {
    try {
      const status = await checkConnector();
      if (!status) { if (!quiet) toast('未检测到本机数据连接器'); return; }
      if (!status.connected) { if (!quiet) connectorHelp(); return; }
      if (!status.sources.length) throw new Error('请先输入网易云歌单 ID。');
      sync.inProgress = true; save(); if (!quiet) { openDataSync(); toast('正在同步网易云歌单'); }
      const staged = await connectorFetch('/sync', { method: 'POST', body: { localSongIds: state.library.map(song => song.id) } });
      applyMetadataUpdates(staged.updates);
      const result = mergeReadySongs(staged.songs || []);
      const items = await queueItems();
      const commit = await connectorFetch('/queue/commit', { method: 'POST' });
      sync.inProgress = false;
      sync.lastSync = new Date().toLocaleString('zh-CN', { hour12: false });
      sync.queueCount = commit.pending || 0;
      sync.pending = items.filter(item => item.status === 'pending');
      sync.lastLiveScan = { time: sync.lastSync, scanned: staged.scanned || 0, added: result.added, updated: staged.updated || result.updated, held: staged.pending ?? result.held };
      save();
      ensure();
      if (!quiet) { closeSheet(); openDataSync(); toast(result.held ? `同步完成，${result.held} 首待确认` : '同步完成'); }
      else if (result.added || result.updated || result.held) toast(result.held ? `自动同步完成，${result.held} 首待确认` : '自动同步完成');
    } catch (error) {
      sync.inProgress = false;
      sync.lastError = error.message;
      save();
      if (!quiet) { openDataSync(); toast(error.message); }
    }
  };
  window.syncNow = () => runSync();
  window.cancelCurrentSync = async () => {
    try {
      await connectorFetch('/queue/cancel', { method: 'POST' });
      sync.queueCount = 0; sync.pending = []; sync.inProgress = false; save();
      openDataSync(); toast('已取消本次同步');
    } catch (error) { toast(error.message); }
  };
  window.removeSource = async id => {
    try {
      await connectorFetch('/sources/' + encodeURIComponent(id), { method: 'DELETE' });
      await checkConnector();
      openDataSync();
      toast('已移除数据来源');
    } catch (error) { toast(error.message); }
  };
  const pendingActions = item => ['中文', '日文', '英文', '纯音乐', '伴奏', '忽略'].map(action => `<button onclick="confirmPendingSong('${safe(item.id)}','${action}')">${action}</button>`).join('');
  window.confirmPendingSong = async (id, action) => {
    try {
      await connectorFetch('/queue/items/' + encodeURIComponent(id), { method: 'POST', body: { action } });
      let added = 0, updated = 0;
      if (!['纯音乐', '伴奏', '忽略'].includes(action)) {
        const items = await queueItems();
        const result = mergeReadySongs(items);
        added = result.added; updated = result.updated;
      }
      const commit = await connectorFetch('/queue/commit', { method: 'POST' });
      const items = await queueItems();
      sync.queueCount = commit.pending || items.length;
      sync.pending = items.filter(item => item.status === 'pending');
      if (added || updated) {
        sync.batches ??= [];
        sync.batches.unshift({ id: `confirm-${Date.now()}`, time: new Date().toLocaleString('zh-CN', { hour12: false }), added, updated, held: sync.pending.length, failed: 0, automatic: true });
      }
      save();
      ensure();
      openPendingSongs();
      toast(['纯音乐', '伴奏', '忽略'].includes(action) ? '已从推荐池排除' : '已确认并入库');
    } catch (error) { toast(error.message); }
  };
  window.openPendingSongs = async () => {
    try {
      const items = await queueItems();
      const pending = items.filter(item => item.status === 'pending');
      sheet(`<div class="handle"></div><h2>待确认歌曲</h2><p>这些歌曲因为语言或人声判断置信度不足，暂不进入推荐池。</p>${pending.length ? pending.slice(0, 40).map(item => `<div class="pending-song"><strong>${safe(item.title)}</strong><span>${safe(item.artist)}<br>${safe(item.language?.reason)}；${safe(item.vocal?.reason)}</span><div class="pending-actions">${pendingActions(item)}</div></div>`).join('') : '<div class="pending-empty">当前没有待确认歌曲。</div>'}<button class="secondary" onclick="openDataSync()">返回数据同步</button>`);
    } catch (error) { toast(error.message); }
  };
  window.toggleAutoSync = async () => {
    const next = !sync.auto;
    sync.auto = next; save();
    try {
      await connectorFetch('/settings', { method: 'POST', body: { autoSync: next, syncPeriodHours: sync.periodHours || 12 } });
      await checkConnector();
      openDataSync();
      toast(sync.auto ? '已恢复自动同步' : '已暂停自动同步');
    } catch (error) {
      sync.auto = !next; save(); openDataSync(); toast(error.message);
    }
  };
  window.undoLatestImport = () => toast('撤销接口下一步再接');
  setTimeout(checkConnector, 1200);
})();
</script></body></html>
